apiVersion: v1
kind: Secret
metadata:
  name: {{ include "paypay-api.fullname" . }}-db-secret
  labels:
    {{- include "paypay-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: "postgresql+psycopg://{{ .Values.database.external.username }}:{{ .Values.database.external.password }}@{{ .Values.database.external.host }}:5432/{{ .Values.database.external.database }}?sslmode={{ .Values.database.external.sslmode }}"
  {{- if .Values.database.local.enabled }}
  local-database-url: "postgresql+psycopg://{{ .Values.database.local.postgresql.username }}:{{ .Values.database.local.postgresql.password }}@{{ .Values.database.local.postgresql.host }}:5432/{{ .Values.database.local.postgresql.database }}"
  {{- end }}