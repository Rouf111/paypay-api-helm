{{- if .Values.database.local.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "paypay-api.fullname" . }}-postgresql
  labels:
    {{- include "paypay-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgresql-password: {{ .Values.database.local.postgresql.password | quote }}
  postgresql-replication-password: {{ .Values.database.local.postgresql.replicationPassword | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "paypay-api.fullname" . }}-postgresql
  labels:
    {{- include "paypay-api.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgresql
  selector:
    app.kubernetes.io/name: {{ include "paypay-api.name" . }}-postgresql
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "paypay-api.fullname" . }}-postgresql
  labels:
    {{- include "paypay-api.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "paypay-api.fullname" . }}-postgresql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "paypay-api.name" . }}-postgresql
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "paypay-api.name" . }}-postgresql
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgresql
          image: "{{ .Values.database.local.postgresql.image.repository }}:{{ .Values.database.local.postgresql.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              value: {{ .Values.database.local.postgresql.database }}
            - name: POSTGRES_USER
              value: {{ .Values.database.local.postgresql.username }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "paypay-api.fullname" . }}-postgresql
                  key: postgresql-password
            - name: POSTGRES_REPLICATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "paypay-api.fullname" . }}-postgresql
                  key: postgresql-replication-password
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: postgresql
          resources:
            {{- toYaml .Values.database.local.resources | nindent 12 }}
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.database.local.postgresql.username }}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.database.local.postgresql.username }}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
  {{- if .Values.database.local.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: {{ .Values.database.local.persistence.storageClass }}
        resources:
          requests:
            storage: {{ .Values.database.local.persistence.size }}
  {{- end }}
{{- end }}